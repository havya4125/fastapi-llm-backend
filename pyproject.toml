[project]
name = "python-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.122.0",
    "fastapi[standard]>=0.128.8",
    "python-dotenv>=1.2.1",
]

[project.scripts]
python-project = "python_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "python_project.main:app"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"
